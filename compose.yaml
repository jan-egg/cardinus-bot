services:
  lavalink:
    build: ./lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512m
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
    ports:
      - "2333:2333"
  cardinus:
    build: .
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file:
      - .env
