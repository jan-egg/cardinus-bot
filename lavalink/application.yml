server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    oauth:
      enabled: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - TV
      - TVHTML5_SIMPLY

metrics:
  prometheus:
    enabled: false
